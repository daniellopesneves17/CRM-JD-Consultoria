# Orquestra toda a aplicação. Após configurar .env, execute: docker compose up --build.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: crm_saude
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_pass
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_saude"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "npx prisma db push && npx prisma db seed && npm run dev"
    ports: ["3001:3001"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://crm_user:crm_pass@postgres:5432/crm_saude
      DIRECT_URL: postgresql://crm_user:crm_pass@postgres:5432/crm_saude
      REDIS_URL: redis://redis:6379
      ENABLE_QUEUE_WORKERS: "true"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: [./backend:/app, backend_node_modules:/app/node_modules]

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    env_file: .env
    environment:
      BACKEND_URL: http://backend:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on: [backend]
    volumes: [./frontend:/app, frontend_node_modules:/app/node_modules]

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
